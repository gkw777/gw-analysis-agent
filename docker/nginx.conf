# analysis-agent frontend — 정적 SPA 서빙용 nginx 설정.
#
# 이 파일은 /etc/nginx/nginx.conf 를 통째로 대체한다.
# 기본 설정은 pid/temp 경로가 root 소유라 non-root 유저로는 기동하지 않으므로,
# 쓰기가 필요한 경로를 전부 /tmp 아래로 옮겼다.
# (k8s 에서 readOnlyRootFilesystem: true 를 쓰므로 /tmp 는 emptyDir 로 마운트한다)

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # 컨테이너 표준 출력으로 — kubectl logs 로 바로 보이게 한다
  access_log /dev/stdout;

  # non-root 기동을 위한 임시 경로 재배치. 하나라도 빠지면 권한 오류로 기동에 실패한다.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  sendfile          on;
  tcp_nopush        on;
  keepalive_timeout 65;
  server_tokens     off;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/xml;

  server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 보안 헤더 — nginx 의 add_header 는 하위 location 에 add_header 가 하나라도 있으면
    # 상속되지 않는다. 그래서 아래 location 들에도 같은 3줄을 반복해 둔다. 지우지 말 것.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # k8s readiness/liveness probe 전용. 액세스 로그를 남기지 않는다.
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # 해시가 파일명에 박힌 자산(js/index.DfejLDwh.js 등).
    # 내용이 바뀌면 URL 자체가 바뀌므로 영구 캐시해도 옛 파일을 볼 일이 없다.
    # vite/vite.dev.ts · vite/vite.prod.ts 의 [hash:8] 설정이 dev/stg/prod 모두에서 이를 보장한다.
    location ~* ^/(js|assets)/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      try_files $uri =404;
    }

    # index.html 은 이름이 고정이고 "어떤 js 를 로드할지" 를 담고 있다.
    # 이것만 캐시하지 않으면 새 이미지를 배포한 즉시 브라우저가 새 번들을 가리킨다.
    # 여기를 캐시하면 배포해도 옛 화면이 그대로 남는다.
    location = /index.html {
      add_header Cache-Control "no-store, must-revalidate" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # SPA fallback — createBrowserRouter 를 쓰므로 /analysis 직접 진입이나 새로고침도
    # index.html 로 받아 클라이언트 라우터가 처리하게 한다. 없으면 404 가 난다.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
