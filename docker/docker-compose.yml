# 로컬에서 dev/stg/prod 이미지를 나란히 띄워 화면을 비교하기 위한 구성.
# 승격 흐름(dev 확인 → stg 확인 → prod 확인)을 클러스터 없이 그대로 재현한다.
#
#   docker compose -f docker/docker-compose.yml up --build frontend-dev   # dev 만 (http://localhost:8081)
#   docker compose -f docker/docker-compose.yml up --build                # 셋 다 (8081 / 8082 / 8083)
#   docker compose -f docker/docker-compose.yml down
#
# context 가 '..' 인 이유: Dockerfile 은 docker/ 에 있지만 빌드 컨텍스트는
# package.json 과 src 가 있는 저장소 루트여야 한다.
#
# 주의: VITE_* 는 빌드 타임에 번들에 박히므로 환경을 바꾸려면 반드시 --build 가 필요하다.
# 컨테이너 환경변수를 바꿔도 화면은 달라지지 않는다.

services:
  frontend-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUILD_ENV: dev
    image: analysis-agent-frontend:local-dev
    ports:
      - '8081:8080'
    restart: unless-stopped

  frontend-stg:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUILD_ENV: stg
    image: analysis-agent-frontend:local-stg
    ports:
      - '8082:8080'
    restart: unless-stopped

  frontend-prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUILD_ENV: prod
    image: analysis-agent-frontend:local-prod
    ports:
      - '8083:8080'
    restart: unless-stopped
