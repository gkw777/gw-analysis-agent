apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: analysis-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80 # 클러스터 내부에서는 80 으로 부르고
      targetPort: http # 컨테이너의 8080(non-root) 으로 보낸다
      protocol: TCP
