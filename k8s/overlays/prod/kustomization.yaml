# prod 환경 — release 브랜치에서 빌드된 이미지를 바라본다.
# 롤백은 재빌드가 아니라 이 파일의 newTag 를 이전 sha 로 되돌리는 것으로 한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: analysis-agent-prod

resources:
  - ../../base

replicas:
  - name: frontend
    count: 2 # 운영은 무중단을 위해 2 이상

# CI(release)가 푸시한 태그로 갱신한다.
#   kustomize edit set image PLACEHOLDER_REGISTRY/analysis-agent/frontend=<레지스트리>/analysis-agent/frontend:prod-<sha>
images:
  - name: PLACEHOLDER_REGISTRY/analysis-agent/frontend
    newName: PLACEHOLDER_REGISTRY/analysis-agent/frontend
    newTag: prod-0000000

patches:
  - target:
      kind: Ingress
      name: frontend
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: example.local
